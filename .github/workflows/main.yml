name: Build Fartex

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target Fartex_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Fartex-VST3
          path: build/Fartex_artefacts/Release/VST3/Fartex.vst3
